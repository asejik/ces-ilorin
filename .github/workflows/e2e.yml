name: End-to-end tests (staging)

# Runs the real browser journeys against the STAGING Supabase project. It creates temporary
# staff and a temporary student and deletes them again. Start it from the Actions tab.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   STAGING_SUPABASE_URL, STAGING_SUPABASE_ANON_KEY, STAGING_SUPABASE_SERVICE_ROLE_KEY
# NEVER put the production project's keys here.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check secrets are set
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing STAGING_* secrets"; exit 1; }
      - run: npx playwright install --with-deps chromium
      - name: Run journeys
        run: npx playwright test
      - name: Load test (100 students over a 10 s window)
        run: |
          npm run start &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health >/dev/null && break; sleep 2; done
          RAMP_SECONDS=10 npm run test:load:quiz
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
